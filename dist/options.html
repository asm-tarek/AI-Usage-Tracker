<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="options.css"><title>AI Usage Tracker settings</title></head><body><main><h1>AI Usage Tracker</h1><form id="settings"><fieldset><legend>Display</legend><label><input id="enabled" type="checkbox"> Show widget</label><label><input id="alwaysExpanded" type="checkbox"> Always show full details (instead of the compact pill)</label><label>Position <select id="position"><option value="top-center">Top center (in the header)</option><option value="top-right">Top right</option><option value="bottom-right">Bottom right</option><option value="top-left">Top left</option><option value="bottom-left">Bottom left</option></select></label><label><input id="countdown" type="checkbox"> Show reset countdown</label><label><input id="updated" type="checkbox"> Show last updated</label></fieldset><fieldset><legend>Providers</legend><label><input id="chatgpt" type="checkbox"> ChatGPT</label><label><input id="claude" type="checkbox"> Claude</label></fieldset><fieldset><legend>Refresh</legend><label>Interval <select id="interval"><option value="1">1 minute</option><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></label></fieldset><fieldset><legend>Notifications (reserved)</legend><label><input id="notifications" type="checkbox" disabled> Enable notifications (Phase 2)</label><label>Threshold <input id="threshold" type="number" min="1" max="100"></label></fieldset><fieldset><legend>Diagnostics</legend><label><input id="debug" type="checkbox"> Safe debug logging</label></fieldset><button type="submit">Save</button><output id="status" aria-live="polite"></output></form></main><script type="module" src="options.js"></script></body></html>
